<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>마카롱 타자연습 - 자리연습</title>
<link rel="stylesheet" href="common.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="keyboard.css">
<style>
  body{
    background: linear-gradient(135deg, #cfe4ff 0%, #ded4f6 30%, #f3d7ec 65%, #fbe6da 100%);
    display:flex; flex-direction:column; justify-content:flex-start; align-items:center;
    min-height:100vh; margin:0; padding:20px 0 50px 0; font-family:sans-serif;
    position:relative; box-sizing:border-box; background-repeat:no-repeat; background-attachment:fixed;
    overflow-x:hidden;
  }
  *{box-sizing:border-box;}
  [hidden]{ display:none !important; }
  body::before{
    content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
    background-image:
      radial-gradient(ellipse 240px 100px at 8% 12%, rgba(255,255,255,.6), transparent 70%),
      radial-gradient(ellipse 280px 110px at 88% 8%, rgba(255,255,255,.55), transparent 70%),
      radial-gradient(ellipse 220px 90px at 78% 88%, rgba(255,255,255,.5), transparent 70%),
      radial-gradient(ellipse 260px 100px at 12% 90%, rgba(255,255,255,.45), transparent 70%),
      radial-gradient(ellipse 200px 80px at 50% 4%, rgba(255,255,255,.4), transparent 70%);
    filter: blur(4px);
  }
  .stars{ position:fixed; inset:0; z-index:-1; pointer-events:none; }
  .star{ position:absolute; width:3px; height:3px; background:#fff; border-radius:50%; box-shadow:0 0 6px 2px rgba(255,255,255,.8); animation:twinkle 1.8s ease-in-out infinite; }
  @keyframes twinkle{
    0%,100%{ opacity:.15; transform:scale(.6); box-shadow:0 0 4px 1px rgba(255,255,255,.4); }
    50%{ opacity:1; transform:scale(1.7); box-shadow:0 0 16px 5px rgba(255,255,255,1); }
  }
  .screen{ width:100%; display:flex; flex-direction:column; align-items:center; }

  /* ---------- Stage select (unchanged) ---------- */
  .header-section{ text-align:center; margin-top:10px; margin-bottom:10px; }
  .main-title{ font-family:'ONEMobilePOP', sans-serif; font-size:55px; color:#5e35b1; text-shadow:2px 2px 0 #fff; margin-bottom:20px; }
  .sub-desc{ font-size:18px; background:#fff; padding:10px 22px; border-radius:30px; color:#5e35b1; display:inline-block; box-shadow:0 4px 10px rgba(0,0,0,.06); font-weight:bold; }
  .home-btn{ background:#fff; color:#5e35b1; border-color:#5e35b1; box-shadow:0 6px 0 #dcd6ff; font-size:18px; padding:12px 22px; display:flex; align-items:center; gap:8px; }
  .stage-grid{ display:flex; flex-direction:column; gap:20px; margin-top:20px; align-items:center; padding:10px; }
  .stage-row{ display:flex; gap:20px; flex-wrap:wrap; justify-content:center; max-width:1300px; }
  .lang-divider{ display:flex; align-items:center; gap:14px; width:100%; max-width:900px; margin-top:10px; font-size:16px; font-weight:bold; color:#5e35b1; }
  .lang-divider::before, .lang-divider::after{ content:""; flex:1; height:3px; background:#d8cff5; border-radius:2px; }
  .stage-card{
    flex:0 0 auto; width:200px; height:240px; background:#fff; border-radius:50px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    box-shadow:0 10px 30px rgba(91,58,138,.15); text-decoration:none; transition:.3s;
    position:relative; border:3px solid #e5deff; cursor:pointer;
  }
  .stage-card:hover{ transform:translateY(-8px); background:#faf8ff; box-shadow:0 20px 40px rgba(91,58,138,.3); border-color:#5b3a8a; }
  .stage-card.locked{ cursor:default; opacity:.55; }
  .stage-card.locked:hover{ transform:none; box-shadow:0 10px 30px rgba(91,58,138,.15); border-color:#e5deff; }
  .stage-badge{ position:absolute; top:18px; background:#f3edff; color:#5b3a8a; padding:5px 14px; border-radius:20px; font-size:14px; font-weight:bold; }
  .stage-icon{ font-size:60px; margin-top:16px; margin-bottom:8px; }
  .stage-title{ font-size:20px; color:#5b3a8a; font-family:'ONEMobilePOP', sans-serif; }
  .stage-desc{ font-size:13px; color:#9c8fc7; margin-top:4px; }

  /* ---------- Game top bar (타자몽 스타일) ---------- */
  .game-wrap{ width:100%; max-width:1620px; padding:0 12px; }
  .content-row{ display:flex; gap:16px; align-items:stretch; width:100%; }
  .main-column{ flex:1 1 auto; min-width:0; display:flex; flex-direction:column; }
  .top-bar{
    display:flex; align-items:center; justify-content:space-between;
    background:linear-gradient(180deg,#3a5568,#25384a); border-radius:16px; padding:10px 16px;
    box-shadow:0 6px 0 #1a2733, 0 10px 18px rgba(0,0,0,.15); margin-bottom:26px;
  }
  .tab-label{
    background:#1a2733; color:#ffd54f; font-family:'ONEMobilePOP', sans-serif; font-size:16px;
    padding:6px 16px; border-radius:20px; display:flex; align-items:center; gap:6px;
  }
  .top-controls{ display:flex; gap:8px; }
  .icon-btn{
    width:38px; height:38px; border-radius:10px; border:none; cursor:pointer;
    background:#f5a623; color:#fff; font-size:16px; box-shadow:0 3px 0 #c9800f;
    display:flex; align-items:center; justify-content:center;
  }
  .icon-btn:active{ transform:translateY(3px); box-shadow:none; }
  .icon-btn.home{ background:#7b61ff; box-shadow:0 3px 0 #5e35b1; }
  .icon-btn.mute{ background:#4fc3d9; box-shadow:0 3px 0 #2f9db3; }
  .icon-btn.off{ background:#8a94a3; box-shadow:0 3px 0 #66707d; }

  /* ---------- Scene ---------- */
  .scene{
    position:relative; width:100%; height:270px; border-radius:24px; overflow:hidden;
    background:linear-gradient(to bottom, #bdeaff 0%, #bdeaff 58%, #b8e994 58%, #93cf68 100%);
    border:4px solid #fff; box-shadow:0 8px 20px rgba(0,0,0,.12); margin-bottom:14px;
  }
  .sun{ position:absolute; top:16px; right:26px; width:46px; height:46px; border-radius:50%;
    background:radial-gradient(circle at 35% 35%, #fff9c4, #ffca28); box-shadow:0 0 18px rgba(255,202,40,.7); }
  .cloud{ position:absolute; background:#fff; border-radius:50px; opacity:.9; }
  .hill{ position:absolute; bottom:-20px; border-radius:50%; background:#7fbf5a; opacity:.6; }
  .tree-deco{ position:absolute; bottom:14px; }
  .tree-deco .top{ width:46px; height:46px; border-radius:50%; background:#6fae4a; }
  .tree-deco .trunk{ width:10px; height:20px; background:#8a5a34; margin:0 auto; border-radius:2px; }

  .avatar-box{
    position:absolute; top:12px; left:12px; background:rgba(255,255,255,.92); border-radius:18px;
    padding:8px 10px 6px; text-align:center; box-shadow:0 6px 14px rgba(0,0,0,.12); z-index:5;
  }
  .avatar-box .creature-svg{ width:56px; height:56px; display:block; }
  .avatar-box .lv-badge{
    margin-top:2px; background:#2b3b47; color:#ffd54f; font-size:11px; font-weight:bold;
    border-radius:8px; padding:2px 8px; font-family:'ONEMobilePOP', sans-serif;
  }

  .creature-queue{
    position:relative; z-index:4; height:100%; display:flex; align-items:flex-end; justify-content:center;
    gap:22px; padding:0 20px 26px 100px;
  }
  .creature-slot{ display:flex; flex-direction:column; align-items:center; transition:transform .3s ease, opacity .3s ease; }
  .creature-slot .creature-svg{ width:70px; height:70px; display:block; filter:drop-shadow(0 4px 4px rgba(0,0,0,.15)); }
  .creature-slot.current .creature-svg{ width:104px; height:104px; animation:bob 1.6s ease-in-out infinite; }
  .creature-slot.upcoming{ opacity:.55; transform:scale(.82); }
  .creature-slot.upcoming .creature-svg{ filter:grayscale(.6) drop-shadow(0 3px 3px rgba(0,0,0,.12)); }
  @keyframes bob{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-6px); } }
  .creature-slot.success .creature-svg{ animation:successPop .38s ease; }
  @keyframes successPop{ 0%{transform:scale(1);} 45%{transform:scale(1.35) rotate(-6deg);} 100%{transform:scale(1);} }

  .orb{
    margin-top:-8px; width:68px; height:68px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-weight:900; font-size:36px; color:#fff;
    background:linear-gradient(135deg, #4B3FA0 0%, #4B3FA0 12%, #8B3FB5 30%, #C13F96 50%, #F06E82 70%, #FF9A78 88%, #FF9A78 100%);
    box-shadow:0 0 6px 2px rgba(255,255,255,.95), 0 0 22px 6px rgba(255,255,255,.55), 0 3px 6px rgba(0,0,0,.2);
    text-shadow:0 2px 3px rgba(0,0,0,.45);
  }
  .creature-slot.current .orb{
    width:112px; height:112px; font-size:60px;
    background:linear-gradient(135deg, #4B3FA0 0%, #4B3FA0 12%, #8B3FB5 30%, #C13F96 50%, #F06E82 70%, #FF9A78 88%, #FF9A78 100%);
    box-shadow:0 0 8px 3px rgba(255,255,255,1), 0 0 32px 8px rgba(255,255,255,.6), 0 4px 8px rgba(0,0,0,.2);
  }
  .creature-slot.upcoming .orb{
    background:#8b93a0;
    box-shadow:0 2px 4px rgba(0,0,0,.2); border-color:rgba(255,255,255,.6);
  }

  .scene.shake{ animation:shake .28s ease; }
  @keyframes shake{ 0%,100%{transform:translateX(0);} 25%{transform:translateX(-8px);} 75%{transform:translateX(8px);} }

  .toast{
    position:absolute; left:50%; bottom:10px; transform:translate(-50%,10px);
    background:#ff8a80; color:#fff; padding:7px 18px; border-radius:16px; font-size:14px; font-weight:bold;
    opacity:0; transition:opacity .2s, transform .2s; pointer-events:none; white-space:nowrap; z-index:6;
  }
  .toast.show{ opacity:1; transform:translate(-50%,0); }

  /* ---------- Side column: reward box (top) + stats box (bottom) ---------- */
  .side-col{ flex:0 0 210px; width:210px; display:flex; flex-direction:column; gap:14px; }
  .reward-box{
    flex:0 0 270px; height:270px; background:#fffaf2; border:5px solid #e2d4c9; border-radius:24px;
    padding:16px; box-shadow:8px 8px 0 #d5c6b9; display:flex; flex-direction:column; overflow:hidden;
  }
  .reward-label{ font-family:'ONEMobilePOP', sans-serif; font-size:16px; color:#8d6e4b; text-align:center; margin-bottom:12px; }
  .reward-grid{
    flex:1; min-height:0; display:flex; flex-wrap:wrap; align-content:flex-start; justify-content:center; gap:8px;
    overflow-y:auto; scrollbar-width:none; -ms-overflow-style:none;
  }
  .reward-grid::-webkit-scrollbar{ display:none; }
  .reward-creature{ width:46px; height:46px; }
  .reward-creature .creature-svg{ width:100%; height:100%; filter:drop-shadow(0 2px 3px rgba(0,0,0,.18)); }
  .reward-creature.pop{ animation:successPop .4s ease; }
  .reward-empty{ color:#c9b8a0; font-size:12px; text-align:center; margin:auto; }

  .stats-box{
    flex:1 1 auto; min-height:0; background:#fffaf2; border:5px solid #e2d4c9; border-radius:24px;
    padding:18px 16px; box-shadow:8px 8px 0 #d5c6b9; display:flex; flex-direction:column;
    margin-bottom:13px;
  }
  .pips-section{ flex:1 1 auto; min-height:0; display:flex; flex-direction:column; }
  .stat-row{ display:flex; align-items:center; gap:8px; margin-bottom:20px; flex:0 0 auto; }
  .stat-row .label{ font-size:14px; font-weight:bold; color:#8d6e4b; width:40px; flex:0 0 auto; }
  .bar-track{ flex:1; height:18px; background:#4a2f26; border-radius:10px; overflow:hidden; box-shadow:inset 0 2px 4px rgba(0,0,0,.3); }
  .bar-fill{ height:100%; border-radius:10px; width:0%; transition:width .3s ease; }
  .bar-fill.accuracy{ background:linear-gradient(90deg,#ffb74d,#ff7043); }
  .stat-row .pct{ font-size:14px; color:#8d6e4b; font-weight:bold; width:36px; text-align:right; flex:0 0 auto; }
  .stage-pips-label{ font-family:'ONEMobilePOP', sans-serif; font-size:14px; color:#8d6e4b; margin-bottom:12px; text-align:center; flex:0 0 auto; }
  .pips-row{
    display:flex; flex-wrap:wrap; gap:6px; justify-content:center; align-content:flex-start;
    flex:1 1 auto; min-height:0; overflow-y:auto; scrollbar-width:none; -ms-overflow-style:none;
  }
  .pips-row::-webkit-scrollbar{ display:none; }
  .pip{ width:28px; height:34px; border-radius:8px; flex:0 0 auto; background:#e1d6ec; border:1px solid #c6b6dd; box-shadow:inset 0 1px 2px rgba(0,0,0,.1); }
  .pip.filled{ background:linear-gradient(180deg,#ff8fa6,#ff6f91); border-color:#e85a7f; }

  /* ---------- Keyboard: see keyboard.css ---------- */

  /* ---------- Complete overlay ---------- */
  #final-popup{
    display:none; position:fixed; top:0; left:0; width:100vw; height:100vh;
    background:rgba(60,50,90,.45); z-index:2000; justify-content:center; align-items:center;
  }
  @keyframes cardPop{ 0%{ transform:scale(.7); opacity:0; } 70%{ transform:scale(1.05); opacity:1; } 100%{ transform:scale(1); } }
  .final-card{
    position:relative; width:min(92vw, 480px); background:#fffaf2; border-radius:36px;
    border:6px solid #fff; box-shadow:0 24px 60px rgba(60,40,100,.35);
    padding:46px 38px 36px; text-align:center; animation:cardPop .35s cubic-bezier(.34,1.56,.64,1);
    overflow:hidden;
  }
  .final-card::before{
    content:""; position:absolute; top:0; left:0; right:0; height:13px;
    background:linear-gradient(90deg,#ff8fa6,#ffd469,#a6d975,#7fd3ff,#c7a2ed);
  }
  .final-emoji{ font-size:68px; margin-bottom:14px; }
  .final-msg{ font-size:30px; color:#5e35b1; font-weight:900; margin-bottom:8px; line-height:1.4; font-family:'ONEMobilePOP', sans-serif; }
  .final-sub{ font-size:17px; color:#8d6e4b; font-weight:bold; margin-bottom:30px; }
  .final-btn-group{ display:flex; flex-direction:column; gap:28px; }
  .final-btn-row{ display:flex; gap:14px; }
  .final-btn{
    background-color:#7b61ff; color:#fff; padding:16px 24px; border-radius:34px; text-decoration:none;
    font-size:18px; font-weight:bold; box-shadow:0 6px 0 #5e35b1; border:none; cursor:pointer; transition:.1s;
    font-family:'ONEMobilePOP', sans-serif; flex:1; display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .final-btn.next{ background-color:#ff8fa6; box-shadow:0 6px 0 #e85a7f; font-size:20px; padding:18px 24px; }
  .final-btn.secondary{ background-color:#fff; color:#7b61ff; box-shadow:0 6px 0 #dcd6ff; border:2px solid #7b61ff; }
  .final-btn:active{ transform:translateY(6px); box-shadow:none; }

  .footer{ color:#7b61ff; margin-top:20px; text-align:center; }

  @media (max-width:900px){
    .main-title{ font-size:40px; }
  }
</style>
</head>
<body>

<div class="stars">
  <div class="star" style="left:5%;top:10%;animation-delay:0s;"></div>
  <div class="star" style="left:15%;top:60%;animation-delay:.3s;"></div>
  <div class="star" style="left:22%;top:25%;animation-delay:.6s;"></div>
  <div class="star" style="left:30%;top:80%;animation-delay:.9s;"></div>
  <div class="star" style="left:38%;top:15%;animation-delay:1.2s;"></div>
  <div class="star" style="left:45%;top:50%;animation-delay:1.5s;"></div>
  <div class="star" style="left:52%;top:88%;animation-delay:1.8s;"></div>
  <div class="star" style="left:60%;top:20%;animation-delay:2.1s;"></div>
  <div class="star" style="left:68%;top:65%;animation-delay:2.4s;"></div>
  <div class="star" style="left:75%;top:10%;animation-delay:.2s;"></div>
  <div class="star" style="left:80%;top:45%;animation-delay:.5s;"></div>
  <div class="star" style="left:88%;top:75%;animation-delay:.8s;"></div>
  <div class="star" style="left:92%;top:25%;animation-delay:1.1s;"></div>
  <div class="star" style="left:12%;top:90%;animation-delay:1.4s;"></div>
  <div class="star" style="left:95%;top:55%;animation-delay:1.7s;"></div>
</div>

<!-- ============ Stage Select ============ -->
<div class="screen" id="screen-select">
  <a href="index.html" class="home-btn"><i class="fa-solid fa-house"></i> 처음으로</a>
  <div class="header-section">
    <div class="main-title">🍬 마카롱 타자연습</div>
    <div class="sub-desc">자리연습으로 손가락 위치를 익혀봐요!</div>
  </div>
  <div class="stage-grid" id="stage-grid"></div>
</div>

<!-- ============ Game ============ -->
<div class="screen" id="screen-game" hidden>
  <div class="game-wrap">
    <div class="top-bar">
      <div class="tab-label"><i class="fa-solid fa-star"></i><span id="stage-name-label">자리연습</span></div>
      <div class="top-controls">
        <button class="icon-btn mute" id="btn-mute" title="소리 켜기/끄기"><i class="fa-solid fa-volume-high" id="mute-icon"></i></button>
        <button class="icon-btn" id="btn-hint" title="정답 불빛 켜기/끄기"><i class="fa-solid fa-lightbulb" id="hint-icon"></i></button>
        <button class="icon-btn home" id="btn-back" title="처음으로"><i class="fa-solid fa-house"></i></button>
      </div>
    </div>

    <div class="content-row">
      <div class="main-column">
        <div class="scene" id="scene">
          <div class="sun"></div>
          <div class="cloud" style="width:60px;height:22px;top:14px;left:20px;"></div>
          <div class="cloud" style="width:44px;height:18px;top:34px;left:70px;"></div>
          <div class="tree-deco" style="left:14px;"><div class="top"></div><div class="trunk"></div></div>
          <div class="tree-deco" style="right:18px;"><div class="top" style="width:36px;height:36px;"></div><div class="trunk" style="height:14px;"></div></div>

          <div class="avatar-box">
            <div id="avatar-slot"></div>
            <div class="lv-badge" id="lv-badge">Lv 1</div>
          </div>

          <div class="creature-queue" id="creature-queue"></div>
          <div class="toast" id="toast"></div>
        </div>

        <div class="kb-scroll" id="keyboard-mount"></div>
      </div>

      <div class="side-col">
        <div class="reward-box">
          <div class="reward-label"><i class="fa-solid fa-trophy"></i> 5연속 콤보 모으기</div>
          <div class="reward-grid" id="reward-grid"><div class="reward-empty" id="reward-empty">아직 없어요</div></div>
        </div>
        <div class="stats-box">
          <div class="stat-row">
            <span class="label">정확도</span>
            <div class="bar-track"><div class="bar-fill accuracy" id="accuracy-fill"></div></div>
            <span class="pct" id="accuracy-pct">100%</span>
          </div>
          <div class="pips-section">
            <div class="stage-pips-label"><i class="fa-solid fa-star"></i> STAGE <span id="stage-count">0/30</span></div>
            <div class="pips-row" id="pips-row"></div>
          </div>
        </div>
      </div>
    </div>

    <footer class="footer">제작 : 김정이 선생님 💕 | © 2026 Coding Playground</footer>
  </div>
</div>

<!-- ============ Complete overlay ============ -->
<div id="final-popup">
  <div class="final-card">
    <div class="final-emoji">🎉🍬✨</div>
    <div class="final-msg" id="final-msg">축하해요!</div>
    <div class="final-sub" id="final-sub">정확도 100%로 클리어했어요!</div>
    <div class="final-btn-group">
      <button class="final-btn next" id="btn-next-stage"><i class="fa-solid fa-forward"></i> 다음 단계로</button>
      <div class="final-btn-row">
        <button class="final-btn secondary" id="btn-replay"><i class="fa-solid fa-rotate-right"></i> 다시하기</button>
        <button class="final-btn secondary" id="btn-home"><i class="fa-solid fa-house"></i> 처음으로</button>
      </div>
    </div>
  </div>
</div>

<script src="keyboard.js"></script>
<script>
(function(){
  "use strict";

  var QUEUE_SIZE = 4;

  var FLAVOR_CYCLE = [
    {shell:"#FFB7C9",cream:"#FF8FA6"}, {shell:"#CBE8A6",cream:"#A6D975"},
    {shell:"#FFE49E",cream:"#FFD469"}, {shell:"#DFC5F3",cream:"#C7A2ED"}
  ];
  function flavorFor(code){
    var sum = 0;
    for (var i = 0; i < code.length; i++) sum += code.charCodeAt(i);
    return FLAVOR_CYCLE[sum % FLAVOR_CYCLE.length];
  }

  var STAGES = [
    { id:1, unlocked:true, emoji:"🍓", name:"ㅁㄴㅇㄹ", desc:"왼손 홈row",
      keys:[
        {code:"KeyA", label:"ㅁ"}, {code:"KeyS", label:"ㄴ"},
        {code:"KeyD", label:"ㅇ"}, {code:"KeyF", label:"ㄹ"}
      ], target:30 },
    { id:2, unlocked:true, emoji:"🍇", name:"ㅓㅏㅣ;", desc:"오른손 홈row",
      keys:[
        {code:"KeyJ", label:"ㅓ"}, {code:"KeyK", label:"ㅏ"},
        {code:"KeyL", label:"ㅣ"}, {code:"Semicolon", label:";"}
      ], target:30 },
    { id:3, unlocked:true, emoji:"🍋", name:"ㅂㅈㄷㄱ", desc:"윗줄 왼쪽",
      keys:[
        {code:"KeyQ", label:"ㅂ"}, {code:"KeyW", label:"ㅈ"},

  var elSelect = document.getElementById("screen-select");
  var elGame = document.getElementById("screen-game");
  var finalPopup = document.getElementById("final-popup");
  var stageGrid = document.getElementById("stage-grid");
  var toastEl = document.getElementById("toast");
  var sceneEl = document.getElementById("scene");
  var accuracyFillEl = document.getElementById("accuracy-fill");
  var accuracyPctEl = document.getElementById("accuracy-pct");
  var pipsRowEl = document.getElementById("pips-row");
  var stageCountEl = document.getElementById("stage-count");
  var stageNameLabel = document.getElementById("stage-name-label");
  var queueEl = document.getElementById("creature-queue");
  var avatarSlot = document.getElementById("avatar-slot");
  var lvBadge = document.getElementById("lv-badge");
  var muteBtn = document.getElementById("btn-mute");
  var rewardGridEl = document.getElementById("reward-grid");

  var current = null;
  var queue = [];
  var currentTarget = null;
  var correctCount = 0;
  var attemptsCorrect = 0, attemptsWrong = 0;
  var streak = 0;
  var STREAK_GOAL = 5;
  var listening = false;
  var muted = false;
  var hintsOn = true;

  // ---- Audio (no external assets) ----
  var actx = null;
  function tone(freq, dur, type, vol){
    if (muted) return;
    try{
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      var osc = actx.createOscillator();
      var gain = actx.createGain();
      osc.type = type || "sine";
      osc.frequency.value = freq;
      gain.gain.value = vol || 0.15;
      osc.connect(gain); gain.connect(actx.destination);
      osc.start();
      gain.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
      osc.stop(actx.currentTime + dur);
    }catch(e){ /* audio unavailable, ignore */ }
  }
  function playCorrect(){ tone(880,0.12,"sine",0.12); setTimeout(function(){tone(1180,0.15,"sine",0.12);},90); }
  function playWrong(){ tone(220,0.18,"sine",0.1); }

  var muteIcon = document.getElementById("mute-icon");
  muteBtn.addEventListener("click", function(){
    muted = !muted;
    muteIcon.className = muted ? "fa-solid fa-volume-xmark" : "fa-solid fa-volume-high";
  });

  var hintBtn = document.getElementById("btn-hint");
  var hintIcon = document.getElementById("hint-icon");
  hintBtn.addEventListener("click", function(){
    hintsOn = !hintsOn;
    hintIcon.className = hintsOn ? "fa-solid fa-lightbulb" : "fa-regular fa-lightbulb";
    hintBtn.classList.toggle("off", !hintsOn);
    if (current && currentTarget) setGuide(currentTarget);
  });

  // ---- Creature SVG ----
  function creatureSVG(shell, cream, awake){
    var eyes = awake
      ? '<circle cx="30" cy="42" r="4" fill="#3b2a20"/><circle cx="50" cy="42" r="4" fill="#3b2a20"/>'
        + '<circle cx="31.5" cy="40.5" r="1.3" fill="#fff"/><circle cx="51.5" cy="40.5" r="1.3" fill="#fff"/>'
      : '<path d="M25 42 Q30 46 35 42" stroke="#3b2a20" stroke-width="2.5" fill="none" stroke-linecap="round"/>'
        + '<path d="M45 42 Q50 46 55 42" stroke="#3b2a20" stroke-width="2.5" fill="none" stroke-linecap="round"/>';
    return '<svg class="creature-svg" viewBox="0 0 80 80">'
      + '<ellipse cx="16" cy="34" rx="13" ry="9" fill="#fff" opacity="0.85" transform="rotate(-25 16 34)"/>'
      + '<ellipse cx="64" cy="34" rx="13" ry="9" fill="#fff" opacity="0.85" transform="rotate(25 64 34)"/>'
      + '<circle cx="40" cy="46" r="27" fill="' + shell + '"/>'
      + '<path d="M13 46 a27 27 0 0 0 54 0 Z" fill="' + cream + '"/>'
      + '<ellipse cx="30" cy="33" rx="7" ry="4" fill="#fff" opacity="0.55"/>'
      + eyes
      + '<ellipse cx="24" cy="53" rx="5" ry="3" fill="#ff9eb0" opacity="0.65"/>'
      + '<ellipse cx="56" cy="53" rx="5" ry="3" fill="#ff9eb0" opacity="0.65"/>'
      + '</svg>';
  }

  // ---- Stage select rendering ----
  function renderStageGrid(){
    stageGrid.innerHTML = "";
    var row = null;
    var lastLang = null;

    STAGES.forEach(function(s, idx){
      if (s.lang !== lastLang){
        var divider = document.createElement("div");
        divider.className = "lang-divider";
        divider.textContent = s.lang === "en" ? "🔤 영어 자리연습" : "🍬 한글 자리연습";
        stageGrid.appendChild(divider);
        row = document.createElement("div");
        row.className = "stage-row";
        stageGrid.appendChild(row);
        lastLang = s.lang;
      } else if (idx % 5 === 0){
        row = document.createElement("div");
        row.className = "stage-row";
        stageGrid.appendChild(row);
      }

      var card = document.createElement("div");
      card.className = "stage-card" + (s.unlocked ? "" : " locked");
      card.innerHTML =
        '<div class="stage-badge">' + (s.unlocked ? (s.no || s.id) + "단계" : "곧 만나요!") + '</div>' +
        '<div class="stage-icon">' + (s.unlocked ? s.emoji : '<i class="fa-solid fa-lock"></i>') + '</div>' +
        '<div class="stage-title">' + s.name + '</div>' +
        '<div class="stage-desc">' + s.desc + '</div>';
      if (s.unlocked){
        card.addEventListener("click", function(){ startStage(s); });
      }
      row.appendChild(card);
    });
  }

  // ---- Queue logic ----
  function randomKeyExcluding(excludeCode){
    var pool = current.keys.filter(function(k){ return k.code !== excludeCode; });
    if (pool.length === 0) pool = current.keys;
    return pool[Math.floor(Math.random() * pool.length)];
  }

  function initQueue(){
    queue = [];
    var prev = null;
    for (var i = 0; i < QUEUE_SIZE; i++){
      var pick = randomKeyExcluding(prev ? prev.code : null);
      queue.push(pick);
      prev = pick;
    }
    currentTarget = queue[0];
  }

  function advanceQueue(){
    queue.shift();
    var last = queue[queue.length - 1];
    queue.push(randomKeyExcluding(last.code));
    currentTarget = queue[0];
  }

  function renderQueue(){
    queueEl.innerHTML = "";
    queue.forEach(function(item, idx){
      var flavor = flavorFor(item.code);
      var slot = document.createElement("div");
      slot.className = "creature-slot " + (idx === 0 ? "current" : "upcoming");
      slot.innerHTML = creatureSVG(flavor.shell, flavor.cream, idx === 0) +
        '<div class="orb">' + item.label + '</div>';
      queueEl.appendChild(slot);
    });
    setGuide(currentTarget);
  }

  function setGuide(target){
    document.querySelectorAll(".key.guide").forEach(function(k){ k.classList.remove("guide"); });
    if (!hintsOn) return;
    var kEl = keyEl(target.code);
    if (kEl) kEl.classList.add("guide");
    if (target.shift){
      var shiftEl = keyEl("ShiftLeft");
      if (shiftEl) shiftEl.classList.add("guide");
    }
  }
  function clearGuide(){
    document.querySelectorAll(".key.guide").forEach(function(k){ k.classList.remove("guide"); });
  }

  // ---- Stats ----
  function renderPips(target){
    pipsRowEl.innerHTML = "";
    for (var i = 0; i < target; i++){
      var pip = document.createElement("div");
      pip.className = "pip";
      pipsRowEl.appendChild(pip);
    }
  }

  function updateStats(){
    stageCountEl.textContent = correctCount + "/" + current.target;

    var totalAttempts = attemptsCorrect + attemptsWrong;
    var accuracyPct = totalAttempts > 0 ? Math.round((attemptsCorrect / totalAttempts) * 100) : 100;
    accuracyFillEl.style.width = accuracyPct + "%";
    accuracyPctEl.textContent = accuracyPct + "%";

    var pips = pipsRowEl.children;
    for (var i = 0; i < pips.length; i++){
      pips[i].classList.toggle("filled", i < correctCount);
    }
  }

  function spawnReward(){
    var emptyMsg = document.getElementById("reward-empty");
    if (emptyMsg) emptyMsg.remove();
    var flavor = FLAVOR_CYCLE[Math.floor(Math.random() * FLAVOR_CYCLE.length)];
    var el = document.createElement("div");
    el.className = "reward-creature pop";
    el.innerHTML = creatureSVG(flavor.shell, flavor.cream, true);
    rewardGridEl.appendChild(el);
  }

  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(showToast._t);
    showToast._t = setTimeout(function(){ toastEl.classList.remove("show"); }, 900);
  }

  // ---- Game flow ----
  function startStage(stage){
    current = stage;
    correctCount = 0;
    attemptsCorrect = 0; attemptsWrong = 0;
    streak = 0;
    rewardGridEl.innerHTML = '<div class="reward-empty" id="reward-empty">아직 없어요</div>';
    stageNameLabel.textContent = stage.name + " 자리연습";
    lvBadge.textContent = "Lv " + (stage.no || stage.id);
    avatarSlot.innerHTML = creatureSVG("#FFD9E4", "#FF8FA6", true);

    initQueue();
    renderQueue();
    renderPips(stage.target);
    updateStats();

    elSelect.hidden = true;
    finalPopup.style.display = "none";
    elGame.hidden = false;
    listening = true;
  }

  function onCorrect(code){
    playCorrect();
    attemptsCorrect++;
    streak++;
    if (streak % STREAK_GOAL === 0) spawnReward();
    var kEl = keyEl(code);
    if (kEl){ kEl.classList.add("pop"); setTimeout(function(){ kEl.classList.remove("pop"); }, 300); }
    correctCount++;
    updateStats();

    if (correctCount >= current.target){
      listening = false;
      clearGuide();
      var curSlot = queueEl.children[0];
      if (curSlot) curSlot.classList.add("success");
      setTimeout(finishStage, 380);
    } else {
      advanceQueue();
      renderQueue();
      var newSlot = queueEl.children[0];
      if (newSlot) newSlot.classList.add("success");
    }
  }

  function onWrong(){
    playWrong();
    attemptsWrong++;
    streak = 0;
    updateStats();
    showToast("다시 눌러볼까요? 😊");
    sceneEl.classList.remove("shake"); void sceneEl.offsetWidth; sceneEl.classList.add("shake");
  }

  function finishStage(){
    document.getElementById("final-msg").textContent = current.name + " 완성!";
    document.getElementById("final-sub").textContent = "정확도 " + accuracyPctEl.textContent + "로 클리어했어요!";

    var nextStage = STAGES.find(function(s){ return s.id === current.id + 1 && s.unlocked && s.keys && s.lang === current.lang; });
    var nextBtn = document.getElementById("btn-next-stage");
    nextBtn.hidden = !nextStage;
    nextBtn.onclick = nextStage ? function(){ startStage(nextStage); } : null;

    elGame.hidden = true;
    finalPopup.style.display = "flex";
  }

  function exitToSelect(){
    listening = false;
    clearGuide();
    elGame.hidden = true;
    finalPopup.style.display = "none";
    elSelect.hidden = false;
  }

  document.getElementById("btn-back").addEventListener("click", exitToSelect);
  document.getElementById("btn-home").addEventListener("click", exitToSelect);
  document.getElementById("btn-replay").addEventListener("click", function(){ startStage(current); });

  // ---- Keyboard press handling (adapted from key_macaron.html) ----
  // keyEl/getExactKeyCode/updateLEDs/renderKeyboard come from keyboard.js
  renderKeyboard('keyboard-mount');

  document.addEventListener('keydown', function(event){
    if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Tab'].indexOf(event.code) !== -1 || event.code.match(/^F\d+$/)) {
      event.preventDefault();
    }
    var code = getExactKeyCode(event);
    var kElAny = keyEl(code);
    if (!kElAny && event.key.match(/^F\d+$/)) kElAny = document.getElementById('key-' + event.key);
    if (kElAny) kElAny.classList.add('pressed');
    updateLEDs(event);

    if (!listening || !current) return;
    if (event.code === currentTarget.code && event.shiftKey === !!currentTarget.shift){ onCorrect(event.code); }
    else if (current.keys.some(function(k){ return k.code === event.code; })){ onWrong(); }
  });

  document.addEventListener('keyup', function(event){
    var code = getExactKeyCode(event);
    var kElAny = keyEl(code);
    if (!kElAny && event.key.match(/^F\d+$/)) kElAny = document.getElementById('key-' + event.key);
    if (kElAny) kElAny.classList.remove('pressed');
    updateLEDs(event);
  });

  window.addEventListener('blur', function(){
    document.querySelectorAll('.key.pressed').forEach(function(k){ k.classList.remove('pressed'); });
  });

  renderStageGrid();
})();
